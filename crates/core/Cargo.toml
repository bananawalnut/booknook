[package]
name = "booknook-core"
description = "Portable Book Nook documents, ontology validation, reading history and provider contracts"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
yrs = { version = "0.28", features = ["sync", "small-client"] }
csv = "1.3"
ed25519-dalek = "2.2"
chacha20poly1305 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
url = "2.5"
# Protocol-only archive validation; no relay or network client.
nostr = { version = "0.44", default-features = false, features = ["std"] }


schemars = "1"
unicode-normalization = "0.1"
