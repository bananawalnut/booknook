[package]
name = "booknook-connectors"
description = "Replaceable Book Nook Nostr, library companion and listening-position connectors"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
booknook-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
nostr-sdk = "0.45.6"
nostr = { version = "0.45.7", default-features = false, features = ["std", "nip44"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[dev-dependencies]
base64.workspace = true
hex.workspace = true
ed25519-dalek = "2.2"

tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "=0.14.7", default-features = false, features = ["crypto", "ring"] }
