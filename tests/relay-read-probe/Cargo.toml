[package]
name = "booknook-read-only-relay-probe"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
booknook-connectors = { path = "../../crates/connectors" }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
serde_json = "1"
