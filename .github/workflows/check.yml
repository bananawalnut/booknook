name: Contracts and native desk
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the WebAssembly C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
      - run: bash scripts/check.sh
      - name: Verify the complete dependency-license inventory
        run: |
          cargo fetch --locked
          python3 scripts/license-inventory.py --check
      - name: Verify the dependency advisory gate policy
        run: python3 -B tests/audit-dependencies.py
      - name: Install the pinned dependency auditor
        timeout-minutes: 10
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit both lockfiles against fresh official RustSec advisories
        timeout-minutes: 4
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          git -c http.sslVerify=true clone --depth 1 --no-tags https://github.com/RustSec/advisory-db.git "$RUNNER_TEMP/booknook-rustsec-db"
          python3 -B scripts/audit-dependencies.py --database "$RUNNER_TEMP/booknook-rustsec-db" --output-dir "$RUNNER_TEMP/booknook-advisory-report"
      - name: Reject oversized negentropy ID lists before allocation
        run: python3 -B scripts/test-negentropy-bounds.py
      - run: bash scripts/test-issuer.sh
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: bash scripts/test-sdk.sh
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
      - run: bash scripts/package-rust.sh
      - run: bash scripts/package-typescript.sh
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
      - run: python3 -m unittest discover -s tests/companion -v
      - name: Verify Apple bundle deployment metadata checks
        run: python3 -B tests/package-apple-apps.py
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - run: brew install xcodegen
      - run: bash scripts/build-apple.sh mac
      - run: bash scripts/build-apple.sh ipad-sim
      - run: bash scripts/build-apple.sh ipad-device
      - run: bash scripts/test-reading.sh
      - run: bash scripts/test-recovery.sh
      - run: bash scripts/test-ui-workflows.sh
      - run: bash scripts/test-feed-source-swift.sh
      - run: bash scripts/test-feed-xml-swift.sh
      - run: bash scripts/test-feed-public-https-swift.sh
      - run: bash scripts/test-feed-cache-swift.sh
      - run: bash scripts/package-swift.sh --use-built
