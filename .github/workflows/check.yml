name: Contracts and native desk
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the WebAssembly C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
      - run: bash scripts/check.sh
      - name: Verify the complete dependency-license inventory
        run: |
          cargo fetch --locked
          python3 scripts/license-inventory.py --check
      - run: bash scripts/test-issuer.sh
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: bash scripts/test-sdk.sh
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
      - run: bash scripts/package-rust.sh
      - run: bash scripts/package-typescript.sh
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
      - run: python3 -m unittest discover -s tests/companion -v
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - run: brew install xcodegen
      - run: bash scripts/build-apple.sh mac
      - run: bash scripts/build-apple.sh ipad-sim
      - run: bash scripts/build-apple.sh ipad-device
      - run: bash scripts/test-reading.sh
      - run: bash scripts/test-recovery.sh
      - run: bash scripts/test-ui-workflows.sh
      - run: bash scripts/package-swift.sh --use-built
