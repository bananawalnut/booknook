name: Publish ontology

on:
  push:
    branches: [main]
    paths:
      - 'ontology/**'
      - 'scripts/ontology_artifacts.py'
      - 'scripts/stage-ontology-pages.py'
      - 'scripts/serve-ontology.py'
      - 'tests/ontology-pages.py'
      - 'tests/ontology-host.py'
      - '.github/workflows/ontology-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ontology-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Verify and stage only public ontology files
        run: |
          python3 -B tests/ontology-pages.py
          python3 -B tests/ontology-host.py
          python3 -B scripts/stage-ontology-pages.py --output "$RUNNER_TEMP/booknook-ontology-site"
      - name: Upload verified static files
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/booknook-ontology-site
          include-hidden-files: true # The isolated stage contains only .nojekyll and the public closure.

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified ontology
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
