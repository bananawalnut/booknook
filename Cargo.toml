[workspace]
members = ["crates/core", "crates/native", "crates/wasm", "crates/connectors"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
booknook-core = { path = "crates/core", version = "0.1.0" }

[profile.release]
lto = "thin"
opt-level = "s"
